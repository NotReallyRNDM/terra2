
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <h5>Your info is sercure </h5>
<br> 

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>
    </form>


    <style>
        body{
            font-family: Helvetica, sans-serif, arial, 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            max-width: 280px;
            margin: 80px auto;
            padding: 100px;
            background: #d7aed9;
            color: #240af2;
        }
    </style>

    <p><a href="/">Home</a></p>

</body>
</html>
