
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <br><br>

        <button type="submit">Register</button>
    </form>


    <style>
        body{
            font-family: Helvetica, sans-serif, arial, 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            max-width: 280px;
            margin: 80px auto;
            padding: 100px;
            background: #87d9f9;
            color: #247af2;
        }
    </style>


    <p><a href="/">Home</a></p>
</body>
</html>
